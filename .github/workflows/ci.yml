name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protocol root dependencies
        run: npm install

      - name: Check vendored protocol artifacts
        run: npm run protocol:artifacts:check

      - name: Contract drift check
        run: npm run test:contracts:drift

  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Code Quality Lint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Start PostgreSQL & PostgREST Stack
        run: |
          docker compose -f ../docker/docker-compose.yml up -d baraza-postgres baraza-postgrest baraza-gateway
          echo "Waiting for PostgREST on port 54321..."
          for i in {1..30}; do
            if curl -s http://localhost:54321/rest/v1/communities?select=count > /dev/null; then
              echo "PostgREST is healthy on port 54321!"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      - name: Run Full Vitest Suite & Stress Tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [protocol, check, test]
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA Bundle
        run: npm run build

      - name: Verify Cloudflare Pages Output
        run: |
          test -f dist/index.html
          test -f dist/_routes.json
          echo "Cloudflare Pages bundle successfully verified."

  deploy:
    name: Cloudflare Pages Deployment
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build Application
        run: cd app && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=baraza-protocol --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
